<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>Covers · UGC Playbook Lab</title>
<style>
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#111118;color:#fff;overflow:hidden}
.c{position:fixed;inset:0;display:grid;grid-template-columns:1.25fr 1fr;align-items:center;padding:5vh 6vw;gap:4vw;
background:radial-gradient(circle at 85% 20%,rgba(255,92,57,.35),transparent 45%),radial-gradient(circle at 10% 90%,rgba(255,92,57,.18),transparent 40%),#111118}
.brand{display:flex;align-items:center;gap:.8vw;font-weight:700;font-size:1.6vw;color:#d9d9e3;margin-bottom:3vh}
.logo{width:2.6vw;height:2.6vw;border-radius:.7vw;background:#ff5c39;display:grid;place-items:center}
.logo:after{content:"";border-left:.9vw solid #fff;border-top:.6vw solid transparent;border-bottom:.6vw solid transparent;margin-left:.2vw}
.tag{display:inline-block;background:#ff5c39;color:#fff;font-weight:800;font-size:1.3vw;letter-spacing:.08em;text-transform:uppercase;padding:.6vh 1vw;border-radius:.5vw;margin-bottom:2.5vh}
h1{font-size:4.6vw;line-height:1.05;font-weight:850;letter-spacing:-.02em}
h1 em{font-style:normal;color:#ff5c39}
p{font-size:1.7vw;line-height:1.4;color:#c9c9d3;margin-top:3vh;max-width:40vw}
ul{list-style:none;padding:0;display:grid;gap:1.6vh}
li{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:1vw;padding:1.8vh 1.4vw;font-size:1.45vw;font-weight:600;display:flex;gap:.9vw;align-items:center}
li b{color:#ff5c39;font-size:1.6vw}
</style></head><body>
<div class="c"><div><div class="brand"><span class="logo"></span>UGC Playbook Lab</div><span class="tag" id="tag"></span><h1 id="h"></h1><p id="s"></p></div><ul id="l"></ul></div>
<script>
const P={
kdp:{tag:"Ebook · 2026 rules",h:"Publish your first Kindle ebook <em>without rejection</em>",s:"Every rule checked against Amazon's own KDP help pages.",l:["AI disclosure, explained","Formatting that passes review","Metadata do's and don'ts","Royalties & KDP Select","Pre-upload checklist"]},
playbook:{tag:"Course · 14 days",h:"The AI UGC Creator <em>Playbook</em>",s:"From zero to a portfolio, a rate card and 20 brand pitches.",l:["Scripts & hooks with AI","3 spec videos, no clients","Real 2026 rate data","Pitch templates","Final quiz & certificate"]},
free:{tag:"Free download",h:"50 AI prompts for <em>UGC creators</em>",s:"Hooks, scripts and brand pitches, plus your first script in 15 minutes.",l:["Hook prompts","Script prompts","Pitch prompts","Your first UGC script","Free, no card needed"]},
pricing:{tag:"Kit · 10 lessons",h:"UGC Pricing & <em>Negotiation</em> Kit",s:"Know what to answer when a brand asks: what's your rate?",l:["Floor, target & walk-away price","Rate card with add-ons","Usage-rights pricing formula","5 negotiation scripts","Quote template & red flags"]}};
const k=new URLSearchParams(location.search).get("p")||"kdp",d=P[k]||P.kdp;
document.getElementById("tag").textContent=d.tag;document.getElementById("h").innerHTML=d.h;document.getElementById("s").textContent=d.s;
document.getElementById("l").innerHTML=d.l.map((x,i)=>"<li><b>"+String(i+1).padStart(2,"0")+"</b>"+x+"</li>").join("");
</script></body></html>
